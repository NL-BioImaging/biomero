name: Build and deploy Sphinx documentation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python for documentation
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Install system dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y gcc python3-dev libpq-dev postgresql-client
        pg_config --version
    - name: Install documentation dependencies
      env:
        SETUPTOOLS_SCM_PRETEND_VERSION: 1
      # Use the project's compatible Sphinx set without an action injecting
      # sphinxnotes-incrbuild, which now requires a newer Sphinx.
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r docs/requirements.txt
    - name: Build Sphinx
      run: python -m sphinx -b html docs docs/_build/html
    - name: Upload built documentation
      uses: actions/upload-artifact@v7
      with:
        name: sphinx-html
        path: docs/_build/html
        if-no-files-found: error
        retention-days: 7

  deploy:
    needs: pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download built documentation
      uses: actions/download-artifact@v8
      with:
        name: sphinx-html
        path: site
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: site
